[project]
name = "supervised-randomforest"
version = "0.1.0"
description = "Supervised learning with random forests (tugas2)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlxtend>=0.25.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
